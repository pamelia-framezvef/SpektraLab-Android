name: Build SpektraLab Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools unzip
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          glslangValidator --version

      - name: Download SpektraLab source
        run: |
          git clone --depth 1 --branch Windows_Linux \
            https://github.com/JamesQiu2005/SpektraLab.git \
            upstream/SpektraLab

      - name: Apply Android patch
        run: |
          unzip -o spektralab-android-patch.zip \
            -d upstream/SpektraLab \
            -x 'engine/CMakeLists.txt'
          test -f upstream/SpektraLab/android/app/src/main/cpp/spektra_jni.cpp
                - name: Install Vulkan Headers
        run: |
          mkdir -p upstream/SpektraLab/build/deps
          git clone --depth 1 --branch vulkan-sdk-1.4.341.0 \
            https://github.com/KhronosGroup/Vulkan-Headers.git \
            upstream/SpektraLab/build/deps/Vulkan-Headers
          test -f upstream/SpektraLab/build/deps/Vulkan-Headers/include/vulkan/vulkan_core.h

      - name: Build APK
        run: |
          cd upstream/SpektraLab/android
          gradle --no-daemon --stacktrace \
            -PglslangValidator="$(command -v glslangValidator)" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-Android-arm64-debug
          path: upstream/SpektraLab/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
